<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1314">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Atlas de Baróvia para celular: personagens, capítulos, a história do vale e a jornada da campanha de Maldição de Strahd.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baróvia">
  <title>Atlas de Baróvia</title>
  <link rel="apple-touch-icon" href="./img/icone-180.png">
  <link rel="icon" type="image/png" href="./img/icone-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="bar">
    <button id="menuBtn" class="bar-btn" type="button" aria-label="Abrir a lista" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h16"/></svg>
    </button>
    <div class="bar-title"><small id="barKicker">Atlas de Baróvia</small><strong id="barTitle"></strong></div>
    <button id="backBtn" class="bar-btn bar-back" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Voltar</span>
    </button>
    <div class="bar-progress" aria-hidden="true"><i id="progressBar"></i></div>
  </header>

  <button id="edgeTab" class="edge-tab" type="button" aria-label="Abrir a lista" aria-controls="drawer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Lista" aria-hidden="true" inert>
    <div class="drawer-head">
      <div><small id="drawerKicker"></small><strong id="drawerTitle"></strong></div>
      <button id="drawerClose" class="bar-btn" type="button" aria-label="Fechar a lista">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div id="drawerTools" class="drawer-tools"></div>
    <div id="drawerList" class="drawer-list"></div>
  </aside>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Seções">
    <button type="button" class="tab" data-tab="p">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3.2 2.8 3.5 6"/></svg>
      <span>Personagens</span>
    </button>
    <button type="button" class="tab" data-tab="c">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3"/><path d="M20 4v14h-6"/></svg>
      <span>Capítulos</span>
    </button>
    <button type="button" class="tab" data-tab="h">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9h3V6h2v3h2V4l2-2 2 2v5h2V6h2v3h3v12z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/></svg>
      <span>História</span>
    </button>
    <button type="button" class="tab" data-tab="j">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-4 3-5 6-6s6-3 6-7"/><circle cx="17" cy="5" r="2"/><circle cx="5" cy="20" r="1.5"/><path d="M8 9.5l1.5 1.5M12 17l1.5 1.5" opacity=".6"/></svg>
      <span>Jornada</span>
    </button>
  </nav>

  <dialog id="photo" class="photo">
    <button id="photoClose" type="button" class="photo-close" aria-label="Fechar retrato">×</button>
    <img id="photoImg" alt="">
    <p id="photoName"></p>
  </dialog>

  <script src="./js/data.js"></script>
  <script src="./js/perfis-data.js"></script>
  <script src="./js/vitals.js"></script>
  <script src="./js/story-data.js"></script>
  <script src="./js/area-index.js"></script>
  <script src="./js/historia-data.js"></script>
  <script src="./js/jornada-data.js"></script>
  <script src="./js/imagens.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
